name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./web
        run: npm install

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          
      # Add Inno Setup to PATH
      - name: Add iscc to PATH
        run: echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Application and Installer
        run: |
          python scripts/build_alpha.py
          
      - name: Read Version
        id: get_version
        run: |
          $version = python -c "from src.gurpsai.__version__ import __version__; print(__version__)"
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/GURPS_Assistant_Setup_v${{ env.VERSION }}.exe
          generate_release_notes: true
